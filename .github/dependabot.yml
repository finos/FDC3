version: 2

# ---------------------------------------------------------------------------
# CVE resolutions vs. routine evergreening
# ---------------------------------------------------------------------------
# Dependabot distinguishes two kinds of update via a group's `applies-to`:
#
#   * security-updates — raised to resolve a known CVE/advisory. These take
#     priority. Security updates are NEVER subject to `cooldown` (Dependabot
#     applies no cooldown to security updates), so they are raised as soon as a
#     fixed version exists — effectively same/next-day. They are also exempt
#     from `open-pull-requests-limit`. Each of these is grouped under a group
#     named "security", and that group identifier appears in the PR title and
#     branch name (e.g. "…/security-…" / "Bump the security group"), which is
#     how CVE PRs are differentiated from evergreening PRs. Dependabot also
#     applies its automatic "dependencies" label plus any SemVer labels.
#
#   * version-updates — routine evergreening. These carry a longer `cooldown`
#     to let newly published versions bake (supply-chain mitigation) and are
#     grouped aggressively (by tooling domain) to reduce PR noise and merge
#     conflicts. Their group names (cucumber, linting, vitest, types, …) mark
#     them as routine in the PR title/branch.
#
# NOTES / limitations:
#   * `labels` and `commit-message` are ecosystem-wide in dependabot.yml — they
#     cannot differ per group — so CVE-vs-evergreen differentiation is carried
#     by the GROUP NAME (surfaced in the title/branch), not by a bespoke label.
#   * `cooldown` only applies to version updates, so the "1 day" target for CVE
#     work is achieved by security updates bypassing cooldown entirely.
#   * The "let new releases bake" supply-chain protection lives HERE (this
#     cooldown), not in .npmrc. `min-release-age` was removed from .npmrc
#     because it re-validates the lockfile on every install and would fail CI
#     on same-day releases — see the note in .npmrc for details.
#   * This relies on Dependabot security updates (+ dependency graph + alerts)
#     being enabled for the repository.
# ---------------------------------------------------------------------------

updates:
  # ---- npm dependencies (workspaces root) --------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      # Applies to evergreening (version) updates only. Security updates are
      # never delayed by cooldown.
      default-days: 7
      semver-major-days: 10
    groups:
      # CVE resolutions — grouped and prioritised; the "security" group name
      # surfaces in the PR title/branch to differentiate from evergreening.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Evergreening — dependencies that are coupled by peer-dependency ranges,
      # shared runtime state, or matching type packages are grouped so that a
      # single PR (of ANY update type, including major) moves them in lockstep.
      #
      # IMPORTANT: Dependabot assigns a dependency to the FIRST group (in file
      # order) that matches it. Groups that claim specific `@types/*` packages
      # therefore MUST be listed before the generic `types` group, and the
      # generic `minor-and-patch` catch-all must stay last.
      #
      # Major updates for anything NOT matched by a named group below are
      # deliberately left as individual PRs, so one breaking library does not
      # block unrelated updates.
      cucumber:
        applies-to: version-updates
        patterns:
          - "@cucumber/*"
          - "@finos/cucumber-testing-steps"
          - "cucumber-console-formatter"
          - "quickpickle"
      linting:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-config-prettier"
          - "eslint-plugin-*"
          - "globals"
          - "prettier"
          - "lint-staged"
          - "husky"
      # TypeScript compiler and the tools that parse/emit against its API.
      typescript:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "ts-morph"
          - "rollup-plugin-dts"
      # Vite and everything that declares a peer range on it (vitest, the
      # vite plugins, vite-express) plus the vitest test environment.
      vite:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vite-express"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      rollup:
        applies-to: version-updates
        patterns:
          - "rollup"
          - "@rollup/*"
      # React runtime, its type packages and the state library bound to it
      # (mobx-react has a peer range on react). NOTE: workspaces currently span
      # react 17 (fdc3-workbench), 18 (fdc3-example-apps) — a major bump of this
      # group will touch both and must be tested against each.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "mobx"
          - "mobx-react"
          - "mobx-react-lite"
      # MUI and its required emotion peers (workbench UI).
      mui:
        applies-to: version-updates
        patterns:
          - "@mui/*"
          - "@emotion/*"
      # JSON Schema validators / parsers that must agree on draft support.
      json-schema:
        applies-to: version-updates
        patterns:
          - "ajv"
          - "ajv-formats"
          - "jsonschema"
          - "@apidevtools/*"
          - "openapi-typescript"
      # Server framework and its types/middleware.
      express:
        applies-to: version-updates
        patterns:
          - "express"
          - "@types/express"
          - "express-rate-limit"
      # socket.io client and server must be protocol compatible.
      socket-io:
        applies-to: version-updates
        patterns:
          - "socket.io"
          - "socket.io-client"
      # Mocha test runner, assertion library and their types (conformance).
      mocha-chai:
        applies-to: version-updates
        patterns:
          - "mocha"
          - "chai"
          - "@types/mocha"
          - "@types/chai"
      # uuid ships its own types from v11+; @types/uuid is kept in step.
      uuid:
        applies-to: version-updates
        patterns:
          - "uuid"
          - "@types/uuid"
      # Libraries paired with a separate types package.
      jsoneditor:
        applies-to: version-updates
        patterns:
          - "jsoneditor"
          - "@types/jsoneditor"
      color:
        applies-to: version-updates
        patterns:
          - "color"
          - "@types/color"
      semver:
        applies-to: version-updates
        patterns:
          - "semver"
          - "@types/semver"
      # @types/node tracks the Node.js runtime (engines / .nvmrc), not other
      # libraries, so it moves independently of the rest of the types.
      node-types:
        applies-to: version-updates
        patterns:
          - "@types/node"
      # Browser polyfills used together by the bundled web apps.
      browser-polyfills:
        applies-to: version-updates
        patterns:
          - "buffer"
          - "events"
          - "process"
          - "util"
          - "path-browserify"
          - "stream-browserify"
      fontsource:
        applies-to: version-updates
        patterns:
          - "@fontsource/*"
      # Build/CLI helper utilities — low coupling, but frequent major bumps that
      # only change supported Node versions; one PR is enough.
      build-utils:
        applies-to: version-updates
        patterns:
          - "cpy-cli"
          - "del-cli"
          - "rimraf"
          - "mkdirp"
          - "fs-extra"
          - "shx"
          - "cross-env"
          - "concurrently"
          - "replace-in-files-cli"
          - "replace-json-property"
      # Remaining @types/* (react, node, express, mocha, … are claimed above).
      types:
        applies-to: version-updates
        patterns:
          - "@types/*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ---- npm dependencies — website (separate lock file, not in workspaces)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 10
    groups:
      # CVE resolutions — prioritised; differentiated by the "security" group
      # name in the PR title/branch.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Docusaurus, its rendering stack AND react/react-dom must move together.
      # Docusaurus declares peer ranges on react/react-dom, redocusaurus is a
      # Docusaurus preset with its own peer range, and layout-elk /
      # prism-react-renderer are consumed through Docusaurus themes. A react
      # major on its own would break the peer range, so react lives in this
      # group (react and react-dom must also always share a version).
      docusaurus:
        applies-to: version-updates
        patterns:
          - "@docusaurus/*"
          - "redocusaurus"
          - "@mermaid-js/layout-elk"
          - "prism-react-renderer"
          - "react"
          - "react-dom"
      # Build/CLI helper utilities — one PR is enough.
      build-utils:
        applies-to: version-updates
        patterns:
          - "cpy-cli"
          - "del-cli"
          - "rimraf"
          - "fs-extra"
          - "cross-env"
          - "replace-in-files-cli"
          - "replace-json-property"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ---- GitHub Actions -----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      # CVE resolutions — prioritised; differentiated by the "security" group
      # name in the PR title/branch.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Evergreening — all actions in a single PR.
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
