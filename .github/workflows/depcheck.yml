name: Dependency Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  depcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0

      - name: Check for unused dependencies
        shell: bash
        run: |
          status=0

          npx depcheck --skip-missing || status=1

          while IFS= read -r workspace; do
            echo "Checking ${workspace}"
            (cd "${workspace}" && npx depcheck --skip-missing) || status=1
          done < <(node -e "require('./package.json').workspaces.forEach(workspace => console.log(workspace))")

          exit "${status}"

